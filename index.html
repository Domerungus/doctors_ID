<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>База Врачей</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0f1d">
  <link rel="apple-touch-icon" href="images/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Поиск врачей</h1>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Введите имя или фамилию врача..." autocomplete="off">
        <div class="search-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
      </div>
    </header>

    <main id="resultsContainer">
      <div class="empty-state">
        <div class="empty-icon">🩺</div>
        <p>Начните вводить имя врача для поиска</p>
      </div>
    </main>
  </div>

  <!-- Modal for specific doctor info -->
  <div class="modal-overlay" id="doctorModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">&times;</button>
      <div class="modal-header">
        <div class="avatar-placeholder">👨‍⚕️</div>
        <h2 id="modalName">Имя Врача</h2>
        <p id="modalSpecialty" class="badge">Специальность</p>
      </div>
      <div class="modal-body">
        <div class="info-row">
          <span class="info-label">Код учреждения (IEST_KODS):</span>
          <span class="info-value" id="modalIestKods">123456</span>
        </div>
        <div class="info-row">
          <span class="info-label">Идентификатор (ID):</span>
          <span class="info-value" id="modalId">000000</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful');
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</body>
</html>
